name: Build and deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Blog domain. Set a repository variable SITE_URL to override:
  # GitHub -> Settings -> Secrets and variables -> Actions -> Variables.
  NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://blog.yingqiu.me' }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          name: id_rsa
          known_hosts: unnecessary

      - name: Sync to server
        run: |
          rsync -az --delete \
            -e "ssh -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new" \
            out/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH || '/var/www/blog' }}/"
