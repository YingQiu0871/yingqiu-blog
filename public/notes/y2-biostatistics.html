<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>大二上 · 医药数理统计</title><style>
:root{color-scheme:light;
 --bg:#f6f8f8;--surface:#fff;--ink:#17222a;--ink2:#36454d;--mut:#65747b;--line:#d9e1e3;--line2:#eef2f3;
 --teal:#0f5c6b;--teal-ink:#fff;--wine:#86224d;--star:#b45309;--ok:#1d7a46;
 --deep-bg:#eef6f7;--key-bg:#fbf0f5;--warn-bg:#fff6e5;--th-bg:#f0f4f5;--zebra:#fafcfc;--chip:#e7f0f2;
 --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
 --f-head:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",Georgia,serif}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;
 --bg:#11171a;--surface:#182126;--ink:#e2eaec;--ink2:#c2ced2;--mut:#8c9ca3;--line:#2b383d;--line2:#202b30;
 --teal:#5db5c5;--teal-ink:#0c1b1f;--wine:#e889b2;--star:#f0b35a;--ok:#6fd39a;
 --deep-bg:#15282c;--key-bg:#2a1a22;--warn-bg:#2a2315;--th-bg:#1f2b30;--zebra:#1b252a;--chip:#1e3036}}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.78 var(--f-body);-webkit-text-size-adjust:100%}
a{color:var(--teal)}
a:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

.top{background:var(--teal);color:var(--teal-ink);padding:36px 16px 30px}
.top-in{max-width:1180px;margin:0 auto}
.eyebrow{margin:0 0 6px;font-size:12.5px;letter-spacing:.14em;opacity:.85}
.top h1{font-family:var(--f-head);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.25;margin:0;text-wrap:balance}
.top .sub{margin:6px 0 0;font-size:16px;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.stats li{font-size:13px;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}
@media (prefers-color-scheme: dark){.stats li{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.2)}}

.layout{max-width:1180px;margin:0 auto;padding:8px 16px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:0 40px}
.doc{min-width:0;max-width:800px}
.side-in{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:22px}
.side-t{font-family:var(--f-head);font-weight:700;font-size:15px;margin-bottom:6px}
.toc,.toc ol{list-style:none;margin:0;padding:0}
.toc a{color:var(--ink2);text-decoration:none;display:block;padding:3px 0}
.toc a:hover{color:var(--teal);text-decoration:underline}
.toc .t2>a{font-weight:600;color:var(--teal)}
.toc .t3{display:none}
@media (min-width:1000px){
 .layout{grid-template-columns:250px minmax(0,1fr)}
 .side-in{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;margin-top:30px;font-size:13.5px;line-height:1.45}
 .toc .t3{display:block}
 .toc .t3 a{padding:2px 0 2px 12px;color:var(--mut);font-size:13px}
 .toc .t2{margin-bottom:6px}
}

h2{font-family:var(--f-head);font-size:clamp(21px,3.6vw,25px);line-height:1.35;margin:52px 0 10px;padding-bottom:10px;border-bottom:2px solid var(--teal);scroll-margin-top:16px}
h2 .n{display:inline-block;min-width:1.7em;color:var(--teal)}
h3{font-family:var(--f-head);font-size:18px;line-height:1.45;margin:32px 0 10px;color:var(--wine);scroll-margin-top:16px}
h4{font-size:15.5px;margin:20px 0 6px}
p{margin:8px 0}
ul,ol{margin:8px 0 8px 22px;padding:0} li{margin:4px 0}
strong{font-weight:650}
.star{color:var(--star);font-weight:650}

.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--surface)}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--th-bg);font-weight:600}
tbody tr:nth-child(even){background:var(--zebra)}

/* numbered points */
.pt{display:flex;gap:10px;margin:8px 0}
.pt .no{flex:none;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--chip);color:var(--teal);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.pt .tx{min-width:0}
.sub-pt{margin:4px 0 4px 36px;padding-left:12px;border-left:2px solid var(--line);color:var(--ink2)}

/* definitions */
.defs{margin:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.def{display:grid;grid-template-columns:minmax(90px,180px) minmax(0,1fr);gap:4px 16px;padding:10px 16px;border-top:1px solid var(--line2)}
.def:first-child{border-top:0}
.def dt{font-weight:700;color:var(--wine)}
.def dd{margin:0;color:var(--ink2)}
@media (max-width:600px){.def{grid-template-columns:1fr}}

/* questions */
.qa{margin:14px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.qa .q{display:flex;gap:10px;padding:11px 16px;background:var(--deep-bg);font-weight:600}
.qa .a{padding:10px 16px 12px}
.qa .a p{margin:6px 0}
.tag{flex:none;display:inline-flex;align-items:center;justify-content:center;height:22px;min-width:22px;padding:0 6px;border-radius:5px;font-size:12px;font-weight:700;margin-top:2px}
.tag.qt{background:var(--teal);color:var(--teal-ink)}
.tag.at{background:var(--wine);color:#fff}
.a-row{display:flex;gap:10px}

.mcq{margin:12px 0;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mcq .stem{display:flex;gap:10px;font-weight:600}
.mcq .stem .no{flex:none;color:var(--teal)}
.opts{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.opts li{margin:0;padding:5px 10px;border-radius:7px;background:var(--line2);font-size:14.5px}
.opts li b{color:var(--mut);margin-right:6px}
.opts li.right{background:var(--key-bg);outline:1.5px solid var(--wine)}
.opts li.right b{color:var(--wine)}
.ans{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--wine);background:var(--key-bg);border-radius:999px;padding:2px 12px}
.blank{display:inline-block;min-width:2.4em;border-bottom:1.5px solid var(--mut);margin:0 3px;text-align:center}

.callout{margin:14px 0;padding:10px 16px;background:var(--warn-bg);border-left:4px solid var(--star);border-radius:0 8px 8px 0}

/* images */
.pages{display:grid;gap:18px;margin:14px 0}
.page{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.page a{display:block;background:#fff}
.page img{display:block;width:100%;height:auto}
.page figcaption{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;font-size:13.5px;color:var(--mut);border-top:1px solid var(--line)}
.page figcaption span:first-child{color:var(--ink2);font-weight:600}
.note{color:var(--mut);font-size:14px}
img.doc-img{display:block;max-width:100%;height:auto;margin:10px auto;padding:6px;background:#fff;border:1px solid var(--line);border-radius:8px}
p img.doc-img,.tx img.doc-img,dd img.doc-img{display:inline-block;vertical-align:middle;margin:4px 6px}

.foot{margin-top:60px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mut)}
@media (max-width:600px){body{font-size:15.5px}h2{margin-top:40px}.qa .q,.qa .a,.mcq{padding-left:13px;padding-right:13px}}
@media print{.side{display:none}.layout{display:block}.top{background:#fff;color:#000}}

/* tables: never squeeze columns into a vertical strip on narrow screens - scroll sideways instead */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{width:auto;min-width:100%}
th,td{min-width:6.5em;max-width:28em}
th{white-space:nowrap}
td p{margin:2px 0}
.a-row>div,.pt .tx{flex:1;min-width:0}

/* tabs (review notes / lecture notes) */
.tabbar{position:sticky;top:0;z-index:30;display:flex;gap:8px;justify-content:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.tabbar button{font:inherit;font-size:14.5px;font-weight:600;padding:6px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer}
.tabbar button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.tabbar button:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
@media (min-width:1000px){.side-in{top:64px;max-height:calc(100vh - 80px)}}
h2,h3{scroll-margin-top:64px}
</style></head><body><header class="top"><div class="top-in"><p class="eyebrow">本科学习笔记 · UNDERGRADUATE NOTES</p><h1>大二上 · 医药数理统计</h1><p class="sub">手写解题笔记 · 假设检验、方差分析、回归与相关</p><ul class="stats"><li>9 页手写笔记</li></ul></div></header><div class="layout"><nav class="side" aria-label="目录"><div class="side-in"><div class="side-t">目录</div><ol class="toc"><li class="t2"><a href="#s1">课堂笔记</a></li><li class="t2"><a href="#s2">习题手写解答</a></li></ol></div></nav><main class="doc"><section id="s1"><h2><span class="n">01</span>课堂笔记</h2><div class="pages"><figure class="page"><a href="/notes/img/y2-biostatistics/s1-01.jpg" target="_blank" rel="noopener"><img src="/notes/img/y2-biostatistics/s1-01.jpg" alt="第 1 页" width="1240" height="1757" loading="lazy"></a><figcaption><span>第 1 页</span><span>1 / 2 · 点击看原图</span></figcaption></figure><figure class="page"><a href="/notes/img/y2-biostatistics/s1-02.jpg" target="_blank" rel="noopener"><img src="/notes/img/y2-biostatistics/s1-02.jpg" alt="第 2 页" width="1240" height="1757" loading="lazy"></a><figcaption><span>第 2 页</span><span>2 / 2 · 点击看原图</span></figcaption></figure></div></section><section id="s2"><h2><span class="n">02</span>习题手写解答</h2><div class="pages"><figure class="page"><a href="/notes/img/y2-biostatistics/s2-01.jpg" target="_blank" rel="noopener"><img src="/notes/img/y2-biostatistics/s2-01.jpg" alt="第 1 题" width="1400" height="465" loading="lazy"></a><figcaption><span>第 1 题</span><span>1 / 7 · 点击看原图</span></figcaption></figure><figure class="page"><a href="/notes/img/y2-biostatistics/s2-02.jpg" target="_blank" rel="noopener"><img src="/notes/img/y2-biostatistics/s2-02.jpg" alt="第 2 题" width="1400" height="585" loading="lazy"></a><figcaption><span>第 2 题</span><span>2 / 7 · 点击看原图</span></figcaption></figure><figure class="page"><a href="/notes/img/y2-biostatistics/s2-03.jpg" target="_blank" rel="noopener"><img src="/notes/img/y2-biostatistics/s2-03.jpg" alt="第 3 题" width="1400" height="1051" loading="lazy"></a><figcaption><span>第 3 题</span><span>3 / 7 · 点击看原图</span></figcaption></figure><figure class="page"><a href="/notes/img/y2-biostatistics/s2-04.jpg" target="_blank" rel="noopener"><img src="/notes/img/y2-biostatistics/s2-04.jpg" alt="第 4 题" width="1400" height="721" loading="lazy"></a><figcaption><span>第 4 题</span><span>4 / 7 · 点击看原图</span></figcaption></figure><figure class="page"><a href="/notes/img/y2-biostatistics/s2-05.jpg" target="_blank" rel="noopener"><img src="/notes/img/y2-biostatistics/s2-05.jpg" alt="第 5 题" width="1400" height="1304" loading="lazy"></a><figcaption><span>第 5 题</span><span>5 / 7 · 点击看原图</span></figcaption></figure><figure class="page"><a href="/notes/img/y2-biostatistics/s2-06.jpg" target="_blank" rel="noopener"><img src="/notes/img/y2-biostatistics/s2-06.jpg" alt="第 6 题" width="1400" height="1051" loading="lazy"></a><figcaption><span>第 6 题</span><span>6 / 7 · 点击看原图</span></figcaption></figure><figure class="page"><a href="/notes/img/y2-biostatistics/s2-07.jpg" target="_blank" rel="noopener"><img src="/notes/img/y2-biostatistics/s2-07.jpg" alt="第 7 题" width="1400" height="578" loading="lazy"></a><figcaption><span>第 7 题</span><span>7 / 7 · 点击看原图</span></figcaption></figure></div></section><p class="foot">本科期末复习资料整理 · 已去除个人信息</p></main></div></body></html>
